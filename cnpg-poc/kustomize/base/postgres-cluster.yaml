apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: my-database
spec:
  instances: 3
  replicationSlots:
    highAvailability:
      enabled: true

  # PostgreSQL configuration
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
      logging_collector: 'on'
      max_wal_senders: "10"
      max_replication_slots: "10"
      wal_level: "logical"

  # Storage configuration
  storage:
    size: 10Gi
    storageClass: standard

  # Backup configuration
  backup:
    barmanObjectStore:
      destinationPath: "s3://cnpg-backups-my-database"
      endpointURL: "http://minio-service.minio-system.svc.cluster.local:9000"
      s3Credentials:
        # Use a Secret for access keys, no hardcoding
        accessKeyId:
          name: backup-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: backup-creds
          key: SECRET_ACCESS_KEY

  # Monitoring configuration
  monitoring:
    enablePodMonitor: true
  
  # Antiaffinity  
  affinity:
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostnames  
