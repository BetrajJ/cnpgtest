# kustomize/base/on-demand-backup.yaml
# This manifest creates a one-time, on-demand backup of your database.

apiVersion: postgresql.cnpg.io/v1
kind: Backup
metadata:
  name: my-database-manual-backup-20250825
spec:
  # The name of the cluster you want to back up
  cluster:
    name: my-database

  # operator to store the backup.
  barmanObjectStore:
    destinationPath: "s3://cnpg-backups-my-database"
    endpointURL: "http://minio-service.minio-system.svc.cluster.local:9000"
    s3Credentials:
      accessKeyId:
        name: backup-creds
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: backup-creds
        key: SECRET_ACCESS_KEY
