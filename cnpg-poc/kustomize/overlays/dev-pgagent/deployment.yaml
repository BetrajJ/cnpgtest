apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgagent
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgagent
  template:
    metadata:
      labels:
        app: pgagent
    spec:
      containers:
      - name: pgagent
        image: local-pgagent-scheduler:v1
        imagePullPolicy: IfNotPresent
        args:
          - "-f"
          - "host=my-database-rw dbname=app user=postgres"
        env:
          - name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: my-database-superuser
                key: password
