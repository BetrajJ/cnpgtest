apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: atlas-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: atlas-system
  source:
    repoURL: https://github.com/BetrajJ/cnpgtest.git
    targetRevision: HEAD
    path: cnpg-poc/helm-charts/atlas-operator
    helm:
      parameters:
      - name: installCRDs
        value: "true"
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true 
      - ServerSideApply=true
