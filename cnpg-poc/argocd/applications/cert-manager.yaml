apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  source:
    repoURL: "https://github.com/BetrajJ/cnpgtest.git"
    targetRevision: HEAD
    path: cnpg-poc/helm-charts/cert-manager
    helm:
      parameters:
      - name: installCRDs
        value: "true"   
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: 
      - CreateNamespace=true
      - ServerSideApply=true
