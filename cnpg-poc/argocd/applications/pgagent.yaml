apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pgagent
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  source:
    repoURL: https://github.com/BetrajJ/cnpgtest.git
    targetRevision: HEAD
    path: kustomize/overlays/dev-pgagent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
